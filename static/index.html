<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>28分析 · 数据看板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* ========== Reset & Base ========== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  /* Cool neutral background — long-session comfort */
  --paper:   #f4f5f7;
  --paper-2: #ffffff;
  --paper-3: #eef0f2;
  --ink:     #1d1d1f;
  --ink-2:   #5c5c62;
  --ink-3:   #8b8b91;
  --rule:    #e2e3e6;
  --rule-2:  #ecedef;

  /* Brand — calm slate blue, low stimulus */
  --accent:  #2c5282;
  --accent-2:#3b6ea5;

  /* Semantic — desaturated for endurance reading */
  --red:    #c4444a;  --red-bg:    #fdf2f2;  --red-bd:    #f0c8cb;
  --green:  #2f855a;  --green-bg:  #f0f7f2;  --green-bd:  #c2e0cc;
  --amber:  #b7791f;  --amber-bg:  #fdf8ed;  --amber-bd:  #ecdcb8;
  --blue:   #3b6ea5;  --blue-bg:   #eff4fa;  --blue-bd:   #c5d6e8;
  --purple: #6b5b95;  --purple-bg: #f4f2f8;  --purple-bd: #d4cee0;

  /* Aliases for legacy JS refs */
  --yellow: var(--amber);
  --orange: #d4633a;

  --radius: 4px;
}

html { font-size: 17px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

body {
  font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--paper);
  color: var(--ink);
  min-height: 100vh;
  line-height: 1.55;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 2px; }

/* ========== Layout ========== */
.container { max-width: 1180px; margin: 0 auto; padding: 0 24px; }

/* ========== Header ========== */
.header {
  background: var(--paper);
  border-bottom: 1px solid var(--rule);
  position: sticky; top: 0; z-index: 100;
}
.header-inner {
  display: flex; align-items: center; justify-content: space-between;
  padding: 16px 0;
}
.logo { display: flex; align-items: center; gap: 14px; }
.logo-icon {
  font-family: "DM Sans", sans-serif;
  font-size: 36px; font-weight: 700; line-height: 1;
  color: var(--accent);
  letter-spacing: -0.03em;
}
.logo-text h1 {
  font-family: "DM Sans", sans-serif;
  font-size: 23px; font-weight: 700; color: var(--ink);
  letter-spacing: -0.01em;
  line-height: 1.2;
}
.logo-text p {
  font-size: 12px; color: var(--ink-3);
  letter-spacing: 0.04em;
  margin-top: 2px;
}
.header-status {
  display: flex; align-items: center; gap: 18px;
  font-size: 13px; color: var(--ink-3);
  letter-spacing: 0.03em;
}
.status-dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--green);
  display: inline-block; margin-right: 6px;
  vertical-align: middle;
}
/* No pulse animation — solid, quiet indicator */
.header-nav {
  display: flex; align-items: center; gap: 20px;
  font-size: 13px;
}
.header-nav a {
  color: var(--ink-2);
  letter-spacing: 0.03em;
  transition: color 0.15s ease;
  display: inline-flex; align-items: center; gap: 5px;
}
.header-nav a:hover { color: var(--accent); }
.header-nav a .nav-dot {
  width: 4px; height: 4px; border-radius: 50%;
  background: var(--accent); opacity: 0.6;
}

/* ========== Hero Section ========== */
.hero { padding: 28px 0 20px; }
.hero-grid {
  display: grid; grid-template-columns: 5fr 7fr; gap: 0;
  border: 1px solid var(--rule);
  background: var(--paper-2);
}

/* Countdown Panel */
.countdown-card {
  padding: 26px 30px;
  border-right: 1px solid var(--rule);
}
.countdown-label {
  font-size: 12px; color: var(--ink-3);
  letter-spacing: 0.04em;
  margin-bottom: 4px;
}
.countdown-period {
  font-family: "JetBrains Mono", monospace;
  font-size: 14px; color: var(--accent); font-weight: 600;
  margin-bottom: 14px;
  font-variant-numeric: tabular-nums;
}
.countdown-display {
  font-family: "JetBrains Mono", monospace;
  font-size: 60px; font-weight: 700; font-variant-numeric: tabular-nums;
  letter-spacing: -0.02em; color: var(--ink);
  display: flex; align-items: baseline; gap: 2px;
  line-height: 1;
}
.countdown-display .sep {
  color: var(--ink-3); font-weight: 400;
  /* No blink — quiet separator */
}
.countdown-display.urgent { color: var(--red); }
.countdown-bar {
  margin-top: 16px; height: 3px;
  background: var(--rule);
  overflow: hidden;
}
.countdown-bar-fill {
  height: 100%;
  background: var(--accent);
  transition: width 0.3s ease, background 0.3s ease;
}

/* Latest Result Panel */
.result-card {
  padding: 26px 30px;
}
.result-label {
  font-size: 12px; color: var(--ink-3);
  letter-spacing: 0.04em;
  margin-bottom: 4px;
}
.result-period {
  font-family: "JetBrains Mono", monospace;
  font-size: 14px; color: var(--accent); font-weight: 600;
  margin-bottom: 14px;
  font-variant-numeric: tabular-nums;
}
.balls { display: flex; align-items: center; gap: 10px; }
.ball {
  width: 52px; height: 52px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: "JetBrains Mono", monospace;
  font-size: 24px; font-weight: 700; color: #fff;
  transition: transform 0.2s ease;
  /* Flat color, no gradient, no shadow */
}
.ball:hover { transform: scale(1.08); }
.ball-sep {
  font-family: "JetBrains Mono", monospace;
  font-size: 20px; color: var(--ink-3); font-weight: 400;
}
.ball-sum {
  font-family: "JetBrains Mono", monospace;
  font-size: 36px; font-weight: 800; color: var(--ink);
  margin-left: 6px;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.result-badges { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
.badge {
  padding: 3px 12px; border-radius: var(--radius);
  font-size: 13px; font-weight: 600;
  letter-spacing: 0.02em;
  border: 1px solid;
}
.badge-big   { background: var(--red-bg);   color: var(--red);   border-color: var(--red-bd); }
.badge-small { background: var(--green-bg); color: var(--green); border-color: var(--green-bd); }
.badge-odd   { background: var(--amber-bg); color: var(--amber); border-color: var(--amber-bd); }
.badge-even  { background: var(--blue-bg);  color: var(--blue);  border-color: var(--blue-bd); }

/* ========== Unopened Strip ========== */
.unopened-strip {
  display: flex; gap: 0;
  border: 1px solid var(--rule); border-top: none;
  background: var(--paper-2);
}
.unopened-item {
  padding: 10px 18px;
  display: flex; align-items: center; gap: 8px;
  flex: 1; min-width: 0;
  border-right: 1px solid var(--rule);
}
.unopened-item:last-child { border-right: none; }
.unopened-type { font-size: 13px; color: var(--ink-3); white-space: nowrap; }
.unopened-count {
  font-family: "JetBrains Mono", monospace;
  font-size: 20px; font-weight: 700; color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.unopened-count.hot { color: var(--red); }

/* ========== Tabs ========== */
.tabs-section { padding: 12px 0 48px; }
.tab-nav {
  display: flex; gap: 0; margin-bottom: 24px;
  border-bottom: 1px solid var(--rule);
}
.tab-btn {
  padding: 10px 24px; border: none;
  background: transparent; color: var(--ink-3);
  font-family: "DM Sans", sans-serif;
  font-size: 15px; font-weight: 500; cursor: pointer;
  transition: color 0.2s ease;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  letter-spacing: 0.02em;
}
.tab-btn:hover { color: var(--ink); }
.tab-btn.active {
  color: var(--ink); font-weight: 600;
  border-bottom-color: var(--accent);
}
.tab-content { display: none; }
.tab-content.active { display: block; animation: fadeIn 0.25s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

/* ========== History Table ========== */
.table-wrap {
  border: 1px solid var(--rule);
  background: var(--paper-2);
  overflow: hidden;
}
table { width: 100%; border-collapse: collapse; }
thead { background: var(--paper-3); }
th {
  padding: 11px 16px; text-align: left;
  font-family: "DM Sans", sans-serif;
  font-size: 12px; font-weight: 600; color: var(--ink-2);
  letter-spacing: 0.04em;
  border-bottom: 1px solid var(--rule);
}
td {
  padding: 9px 16px;
  font-family: "JetBrains Mono", monospace;
  font-size: 14px; color: var(--ink);
  border-bottom: 1px solid var(--rule-2);
  font-variant-numeric: tabular-nums;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr { transition: background 0.12s ease; }
tbody tr:hover { background: var(--paper-3); }
td .nums { display: flex; align-items: center; gap: 5px; }
td .mini-ball {
  width: 26px; height: 26px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center;
  font-family: "JetBrains Mono", monospace;
  font-size: 13px; font-weight: 700; color: #fff;
}
.mini-sum {
  font-family: "JetBrains Mono", monospace;
  font-weight: 700; color: var(--ink); margin-left: 4px;
  font-variant-numeric: tabular-nums;
}
.tag {
  padding: 2px 8px; border-radius: var(--radius);
  font-family: "DM Sans", sans-serif;
  font-size: 12px; font-weight: 600;
  border: 1px solid;
}
.tag-big   { background: var(--red-bg);   color: var(--red);   border-color: var(--red-bd); }
.tag-small { background: var(--green-bg); color: var(--green); border-color: var(--green-bd); }
.tag-odd   { background: var(--amber-bg); color: var(--amber); border-color: var(--amber-bd); }
.tag-even  { background: var(--blue-bg);  color: var(--blue);  border-color: var(--blue-bd); }

/* Pagination */
.pagination {
  display: flex; align-items: center; justify-content: center;
  gap: 6px; margin-top: 20px;
}
.page-btn {
  padding: 5px 14px; border-radius: var(--radius);
  border: 1px solid var(--rule); background: var(--paper);
  color: var(--ink-2);
  font-family: "JetBrains Mono", monospace;
  font-size: 14px; cursor: pointer;
  transition: all 0.15s ease;
}
.page-btn:hover:not(:disabled) { border-color: var(--ink); color: var(--ink); }
.page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.page-btn.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.page-info {
  font-family: "JetBrains Mono", monospace;
  font-size: 13px; color: var(--ink-3); margin: 0 10px;
  font-variant-numeric: tabular-nums;
}

/* ========== Trend Chart ========== */
.trend-wrap {
  border: 1px solid var(--rule);
  background: var(--paper-2);
  padding: 24px;
}
.trend-controls { display: flex; gap: 6px; margin-bottom: 16px; }
.trend-btn {
  padding: 5px 14px; border-radius: var(--radius);
  border: 1px solid var(--rule); background: transparent;
  color: var(--ink-3);
  font-family: "DM Sans", sans-serif;
  font-size: 13px; cursor: pointer;
  transition: all 0.15s ease;
}
.trend-btn:hover { color: var(--ink); border-color: var(--ink-3); }
.trend-btn.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
#trendSvg { width: 100%; height: 400px; }
.trend-legend {
  display: flex; gap: 20px; margin-top: 12px;
  font-size: 13px; color: var(--ink-3);
}
.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }

/* ========== Unopened Grid ========== */
.unopened-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
}
.unopened-card {
  border: 1px solid var(--rule);
  background: var(--paper-2);
  padding: 20px; text-align: center;
  transition: border-color 0.2s ease, background 0.2s ease;
}
.unopened-card:hover { border-color: var(--ink-3); background: var(--paper-3); }
.unopened-card .type-label {
  font-size: 15px; color: var(--ink-2); font-weight: 600;
  margin-bottom: 6px;
}
.unopened-card .type-count {
  font-family: "JetBrains Mono", monospace;
  font-size: 40px; font-weight: 800; color: var(--ink);
  font-variant-numeric: tabular-nums; line-height: 1;
}
.unopened-card .type-count.hot { color: var(--red); }
.unopened-card .type-desc { font-size: 12px; color: var(--ink-3); margin-top: 6px; }

/* ========== Sum Unopened Grid ========== */
.sum-unopened-wrap {
  border: 1px solid var(--rule);
  background: var(--paper-2);
  padding: 24px;
}
.sum-unopened-tip {
  font-size: 13px; color: var(--ink-3); margin-bottom: 16px;
  letter-spacing: 0.02em;
}
.sum-unopened-grid {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px;
}
.sum-card {
  background: var(--paper);
  border: 1px solid var(--rule);
  padding: 12px 8px; text-align: center;
  transition: border-color 0.2s ease, background 0.2s ease;
}
.sum-card:hover { border-color: var(--ink-3); background: var(--paper-3); }
.sum-card .sc-head {
  display: flex; justify-content: space-between; align-items: center;
  font-family: "JetBrains Mono", monospace;
  font-size: 13px; font-weight: 700; margin-bottom: 4px;
}
.sum-card .sc-num { color: var(--accent); }
.sum-card .sc-odd { color: var(--ink-3); font-size: 11px; }
.sum-card .sc-count {
  font-family: "JetBrains Mono", monospace;
  font-size: 26px; font-weight: 800; color: var(--ink);
  font-variant-numeric: tabular-nums; line-height: 1;
}
.sum-card .sc-count.hot { color: var(--red); }
.sum-card .sc-count.warm { color: var(--amber); }
.sum-card .sc-label { font-size: 11px; color: var(--ink-3); margin-top: 2px; }

/* ========== Footer ========== */
.footer {
  text-align: center; padding: 24px 0;
  font-size: 13px; color: var(--ink-3);
  border-top: 1px solid var(--rule);
  letter-spacing: 0.03em;
}

/* ========== Loading ========== */
.loading {
  text-align: center; padding: 32px; color: var(--ink-3);
  font-family: "JetBrains Mono", monospace;
  font-size: 14px;
}
.loading::after {
  content: ''; display: inline-block; width: 14px; height: 14px;
  border: 2px solid var(--rule); border-top-color: var(--accent);
  border-radius: 50%; animation: spin 0.8s linear infinite;
  margin-left: 8px; vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ========== Ball Colors — desaturated for long-session comfort ========== */
.c0 { background: #86868b; }
.c1 { background: #c4444a; }
.c2 { background: #d4633a; }
.c3 { background: #c4832a; }
.c4 { background: #6b9b3f; }
.c5 { background: #3a8a5a; }
.c6 { background: #3a8a82; }
.c7 { background: #4a6fa5; }
.c8 { background: #5b5b9e; }
.c9 { background: #8a5aaa; }

/* ========== Responsive ========== */
@media (max-width: 768px) {
  .hero-grid { grid-template-columns: 1fr; }
  .countdown-card { border-right: none; border-bottom: 1px solid var(--rule); }
  .countdown-display { font-size: 46px; }
  .ball { width: 42px; height: 42px; font-size: 20px; }
  .ball-sum { font-size: 28px; }
  .unopened-grid { grid-template-columns: repeat(2, 1fr); }
  .sum-unopened-grid { grid-template-columns: repeat(4, 1fr); }
  .unopened-strip { flex-wrap: wrap; }
  .unopened-item { flex: 1 1 45%; border-bottom: 1px solid var(--rule); }
  .header-status { display: none; }
  th, td { padding: 8px 10px; font-size: 12px; }
  .container { padding: 0 16px; }
  .tab-btn { padding: 8px 16px; font-size: 13px; }
}
</style>
</head>
<body>

<!-- Header -->
<header class="header">
  <div class="container header-inner">
    <div class="logo">
      <div class="logo-icon">28</div>
      <div class="logo-text">
        <h1>28数据分析</h1>
        <p>更新快 · 数据全 · 倒计时精准</p>
      </div>
    </div>
    <nav class="header-nav">
      <a href="http://localhost:8080/api-doc" target="_blank"><span class="nav-dot"></span>API 文档</a>
      <a href="http://localhost:8080/backtest" target="_blank"><span class="nav-dot"></span>回测仪表盘</a>
    </nav>
    <div class="header-status">
      <span><span class="status-dot"></span>自动采集中</span>
      <span id="dbInfo">加载中...</span>
    </div>
  </div>
</header>

<!-- Hero -->
<section class="hero">
  <div class="container">
    <div class="hero-grid">
      <!-- Countdown -->
      <div class="countdown-card">
        <div class="countdown-label">距下期更新</div>
        <div class="countdown-period" id="nextPeriod">第 --- 期</div>
        <div class="countdown-display" id="countdown">
          <span id="cdMin">00</span>
          <span class="sep">:</span>
          <span id="cdSec">00</span>
        </div>
        <div class="countdown-bar">
          <div class="countdown-bar-fill" id="cdBar" style="width: 100%"></div>
        </div>
      </div>

      <!-- Latest Result -->
      <div class="result-card">
        <div class="result-label">最新数据</div>
        <div class="result-period" id="latestPeriod">第 --- 期</div>
        <div class="balls" id="latestBalls">
          <div class="ball c0">?</div>
          <span class="ball-sep">+</span>
          <div class="ball c0">?</div>
          <span class="ball-sep">+</span>
          <div class="ball c0">?</div>
          <span class="ball-sep">=</span>
          <span class="ball-sum">?</span>
        </div>
        <div class="result-badges" id="latestBadges"></div>
      </div>
    </div>

    <!-- Unopened strip -->
    <div class="unopened-strip" id="unopenedStrip"></div>
  </div>
</section>

<!-- Tabs -->
<section class="tabs-section">
  <div class="container">
    <div class="tab-nav">
      <button class="tab-btn active" data-tab="history">数据列表</button>
      <button class="tab-btn" data-tab="trend">总和走势</button>
      <button class="tab-btn" data-tab="unopened">未开期数</button>
      <button class="tab-btn" data-tab="sum-unopened">特码未出</button>
    </div>

    <!-- History Tab -->
    <div class="tab-content active" id="tab-history">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>期数</th>
              <th>号码</th>
              <th>和值</th>
              <th>大小</th>
              <th>单双</th>
              <th>时间</th>
            </tr>
          </thead>
          <tbody id="historyBody">
            <tr><td colspan="6"><div class="loading">加载中</div></td></tr>
          </tbody>
        </table>
      </div>
      <div class="pagination" id="pagination"></div>
    </div>

    <!-- Trend Tab -->
    <div class="tab-content" id="tab-trend">
      <div class="trend-wrap">
        <div class="trend-controls">
          <button class="trend-btn active" data-limit="30">最近30期</button>
          <button class="trend-btn" data-limit="50">最近50期</button>
          <button class="trend-btn" data-limit="100">最近100期</button>
          <button class="trend-btn" data-limit="200">最近200期</button>
        </div>
        <svg id="trendSvg"></svg>
        <div class="trend-legend">
          <div class="legend-item"><span class="legend-dot" style="background:var(--red)"></span> 大 (≥14)</div>
          <div class="legend-item"><span class="legend-dot" style="background:var(--green)"></span> 小 (<14)</div>
          <div class="legend-item">--- 虚线为14分界线 ---</div>
        </div>
      </div>
    </div>

    <!-- Unopened Tab -->
    <div class="tab-content" id="tab-unopened">
      <div class="unopened-grid" id="unopenedGrid">
        <div class="loading">加载中</div>
      </div>
    </div>

    <!-- Sum Unopened Tab -->
    <div class="tab-content" id="tab-sum-unopened">
      <div class="sum-unopened-wrap">
        <div class="sum-unopened-tip">特码 = c1 + c2 + c3 的和值 · 显示每个和值多少期未出 · 红色为热门遗漏</div>
        <div class="sum-unopened-grid" id="sumUnopenedGrid">
          <div class="loading">加载中</div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- Footer -->
<footer class="footer">
  <div class="container">
    <p>数据每 3.5 分钟自动更新 · 仅供学习研究 · &copy; 2026 28数据分析</p>
  </div>
</footer>

<script>
// ========== 常量 ==========
const CYCLE = 210;
const BASE_EPOCH = 1058114851;

// ========== 状态 ==========
let serverOffset = 0;        // 服务器时间 - 客户端时间 (秒)
let currentPage = 1;
let totalPages = 1;
const pageSize = 30;
let lastDrawNbr = 0;         // 最新已显示的期号
let countdownInterval = null;
let syncInterval = null;
let refreshInterval = null;   // 定时刷新兜底 (SSE 失败时使用)
let waitingForResult = false; // 是否在等待新结果
let waitingPeriod = 0;        // 等待的期号

// ========== 工具函数 ==========
function getServerTs() {
  return Date.now() / 1000 + serverOffset;
}

function getCountdown() {
  const ts = getServerTs();
  const elapsed = ts - BASE_EPOCH;
  const remaining = CYCLE - (elapsed % CYCLE);
  return remaining >= CYCLE ? 0 : remaining;
}

function getCurrentPeriod() {
  const ts = getServerTs();
  const elapsed = ts - BASE_EPOCH;
  return Math.floor(elapsed / CYCLE);
}

function fmtTime(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return { m: String(m).padStart(2, '0'), s: String(sec).padStart(2, '0') };
}

// ========== 服务器时间同步 ==========
async function syncServerTime() {
  try {
    const t1 = Date.now() / 1000;
    const resp = await fetch('/api/time');
    const data = await resp.json();
    const t2 = Date.now() / 1000;
    // 服务器生成 server_time 的时刻 ≈ (t1 + t2) / 2 (假设网络对称)
    const midTs = (t1 + t2) / 2;
    serverOffset = data.server_time - midTs;
  } catch (e) {
    console.error('时间同步失败:', e);
  }
}

// ========== SSE 实时推送 ==========
let evtSource = null;
function setupSSE() {
  if (evtSource) evtSource.close();
  try {
    evtSource = new EventSource('/api/events');
  } catch (e) {
    console.error('SSE 不支持, 将回退轮询:', e);
    return;
  }
  // 连接建立 + 服务器时间同步
  evtSource.addEventListener('hello', (e) => {
    try {
      const data = JSON.parse(e.data);
      if (data.server_time) {
        serverOffset = data.server_time - Date.now() / 1000;
        console.log('[sse] hello, offset=', serverOffset.toFixed(3));
      }
    } catch (err) {}
  });
  // 新开奖数据: 立即刷新页面
  evtSource.addEventListener('new_draw', (e) => {
    try {
      const data = JSON.parse(e.data);
      if (data.latest) {
        console.log('[sse] 收到新数据 #' + data.latest.draw_nbr);
        onNewDraw(data.latest);
      }
    } catch (err) {
      console.error('[sse] 解析失败:', err);
    }
  });
  evtSource.onerror = () => {
    // EventSource 会自动重连, 这里只记日志
    console.warn('[sse] 连接断开, 自动重连中...');
  };
}

function onNewDraw(latest) {
  // 用服务器推送的数据刷新显示
  showLatestResult(latest, true);
  // 同步刷新历史列表 / 未开期数 / 特码未出 / 退出等待状态
  if (latest.draw_nbr > lastDrawNbr) {
    lastDrawNbr = latest.draw_nbr;
    loadHistory(currentPage);
    loadUnopened();
    loadSumUnopened();
  }
  if (waitingForResult) {
    exitWaitingState();
  }
}

// ========== 倒计时 ==========
function updateCountdown() {
  if (waitingForResult) return; // 等待开奖中, 暂停倒计时

  const remaining = getCountdown();
  const period = getCurrentPeriod();
  const nextPeriod = period + 1;
  const { m, s } = fmtTime(remaining);

  document.getElementById('cdMin').textContent = m;
  document.getElementById('cdSec').textContent = s;
  document.getElementById('nextPeriod').textContent = `第 ${nextPeriod} 期`;

  const display = document.getElementById('countdown');
  const bar = document.getElementById('cdBar');
  const pct = (remaining / CYCLE) * 100;

  bar.style.width = pct + '%';

  if (remaining <= 10) {
    display.classList.add('urgent');
    bar.style.background = 'var(--red)';
  } else {
    display.classList.remove('urgent');
    bar.style.background = 'var(--accent)';
  }

  // 倒计时归零, 进入等待开奖状态
  if (remaining < 1) {
    enterWaitingState(period + 1);
  }
}

function enterWaitingState(expectedPeriod) {
  waitingForResult = true;
  waitingPeriod = expectedPeriod;

  // 显示等待状态
  const display = document.getElementById('countdown');
  display.classList.remove('urgent');
  display.innerHTML = '<span style="font-size:24px;color:var(--amber);font-family:JetBrains Mono,monospace;letter-spacing:0.02em">等待开奖</span>';
  document.getElementById('nextPeriod').textContent = `第 ${expectedPeriod} 期`;
  document.getElementById('cdBar').style.width = '0%';

  // 隐藏旧号码 (避免花眼), 显示占位符
  document.getElementById('latestPeriod').textContent = `第 ${expectedPeriod} 期 (等待开奖)`;
  document.getElementById('latestBalls').innerHTML = `
    <div class="ball c0">?</div>
    <span class="ball-sep">+</span>
    <div class="ball c0">?</div>
    <span class="ball-sep">+</span>
    <div class="ball c0">?</div>
    <span class="ball-sep">=</span>
    <span class="ball-sum">?</span>
  `;
  document.getElementById('latestBadges').innerHTML = '';

  // 开始长轮询
  pollForNewDraw(lastDrawNbr);
}

async function pollForNewDraw(afterNbr) {
  const maxAttempts = 120; // 最多尝试120次 (约60秒)
  for (let i = 0; i < maxAttempts; i++) {
    try {
      const resp = await fetch('/api/latest');
      const data = await resp.json();
      if (data.latest && data.latest.draw_nbr > afterNbr) {
        // 新数据到了! 先更新页面
        showLatestResult(data.latest, true);
        lastDrawNbr = data.latest.draw_nbr;
        loadHistory(currentPage);
        loadUnopened();
        loadSumUnopened();
        // 数据显示完毕, 才恢复倒计时
        exitWaitingState();
        return;
      }
    } catch (e) {
      console.error('轮询失败:', e);
    }
    // 继续尝试, 每500ms
    if (waitingForResult) {
      await new Promise(r => setTimeout(r, 500));
    } else {
      return;
    }
  }
  console.warn('等待开奖超时, 兜底刷新最新数据');
  // 超时兜底: 主动刷新一次最新数据 (防止漏掉更新)
  await loadLatest(true);
  exitWaitingState();
}

function exitWaitingState() {
  waitingForResult = false;
  // 恢复倒计时显示
  const display = document.getElementById('countdown');
  display.innerHTML = '<span id="cdMin">00</span><span class="sep">:</span><span id="cdSec">00</span>';
}

// ========== 最新数据 ==========
function showLatestResult(d, animate) {
  document.getElementById('latestPeriod').textContent = `第 ${d.draw_nbr} 期`;

  const ballsHtml = `
    <div class="ball c${d.c1}">${d.c1}</div>
    <span class="ball-sep">+</span>
    <div class="ball c${d.c2}">${d.c2}</div>
    <span class="ball-sep">+</span>
    <div class="ball c${d.c3}">${d.c3}</div>
    <span class="ball-sep">=</span>
    <span class="ball-sum">${d.draw_num}</span>
  `;
  document.getElementById('latestBalls').innerHTML = ballsHtml;

  const sizeClass = d.size_type === '大' ? 'badge-big' : 'badge-small';
  const parityClass = d.parity_type === '单' ? 'badge-odd' : 'badge-even';
  document.getElementById('latestBadges').innerHTML = `
    <span class="badge ${sizeClass}">${d.size_type}</span>
    <span class="badge ${parityClass}">${d.parity_type}</span>
    <span class="badge" style="background:var(--purple-bg);color:var(--purple);border:1px solid var(--purple-bd)">${d.combination_type}</span>
  `;

  if (animate) {
    document.querySelectorAll('#latestBalls .ball').forEach((b, i) => {
      b.style.animation = 'none';
      void b.offsetWidth;
      b.style.animation = `fadeIn 0.4s ease ${i * 0.12}s`;
    });
  }
}

async function loadLatest(animate) {
  try {
    const resp = await fetch('/api/latest');
    const data = await resp.json();
    if (!data.latest) return;

    // 期号变化时, 刷新所有相关数据 (SSE 兜底机制)
    const isNew = lastDrawNbr > 0 && data.latest.draw_nbr > lastDrawNbr;
    showLatestResult(data.latest, animate);
    if (isNew) {
      console.log('[loadLatest] 检测到期号变化 #' + lastDrawNbr + ' -> #' + data.latest.draw_nbr);
      loadHistory(currentPage);
      loadUnopened();
      loadSumUnopened();
      // 如果在等待状态, 退出
      if (waitingForResult) {
        exitWaitingState();
      }
    }
    lastDrawNbr = data.latest.draw_nbr;
  } catch (e) {
    console.error('加载最新数据失败:', e);
  }
}

// ========== 历史记录 ==========
async function loadHistory(page) {
  currentPage = page;
  const body = document.getElementById('historyBody');
  body.innerHTML = '<tr><td colspan="6"><div class="loading">加载中</div></td></tr>';

  try {
    const resp = await fetch(`/api/history?page=${page}&size=${pageSize}`);
    const data = await resp.json();
    totalPages = data.pages;

    body.innerHTML = data.list.map(d => `
      <tr>
        <td>${d.draw_nbr}</td>
        <td>
          <div class="nums">
            <span class="mini-ball c${d.c1}">${d.c1}</span>
            <span class="mini-ball c${d.c2}">${d.c2}</span>
            <span class="mini-ball c${d.c3}">${d.c3}</span>
            <span class="mini-sum">= ${d.draw_num}</span>
          </div>
        </td>
        <td><strong>${d.draw_num}</strong></td>
        <td><span class="tag ${d.size_type === '大' ? 'tag-big' : 'tag-small'}">${d.size_type}</span></td>
        <td><span class="tag ${d.parity_type === '单' ? 'tag-odd' : 'tag-even'}">${d.parity_type}</span></td>
        <td style="color:var(--ink-3);font-size:12px">${d.draw_time}</td>
      </tr>
    `).join('');

    renderPagination(data);
  } catch (e) {
    body.innerHTML = `<tr><td colspan="6" style="text-align:center;color:var(--red)">加载失败</td></tr>`;
  }
}

function renderPagination(data) {
  const el = document.getElementById('pagination');
  const p = data.page;
  const pages = data.pages;

  let html = '';
  html += `<button class="page-btn" ${p <= 1 ? 'disabled' : ''} onclick="loadHistory(${p - 1})">上一页</button>`;

  const start = Math.max(1, p - 2);
  const end = Math.min(pages, p + 2);
  for (let i = start; i <= end; i++) {
    html += `<button class="page-btn ${i === p ? 'active' : ''}" onclick="loadHistory(${i})">${i}</button>`;
  }

  html += `<span class="page-info">${p} / ${pages} 页 (共 ${data.total} 期)</span>`;
  html += `<button class="page-btn" ${p >= pages ? 'disabled' : ''} onclick="loadHistory(${p + 1})">下一页</button>`;
  el.innerHTML = html;
}

// ========== 走势图 ==========
async function loadTrend(limit) {
  const svg = document.getElementById('trendSvg');
  svg.innerHTML = '<text x="50%" y="50%" text-anchor="middle" fill="#8b8b91" font-family="JetBrains Mono,monospace" font-size="14">加载中...</text>';

  try {
    const resp = await fetch(`/api/trend?limit=${limit}`);
    const data = await resp.json();
    if (!data.length) return;

    const W = 1000, H = 400;
    const pad = { top: 30, right: 30, bottom: 40, left: 40 };
    const cw = W - pad.left - pad.right;
    const ch = H - pad.top - pad.bottom;
    const minV = 0, maxV = 27;

    const xStep = cw / Math.max(1, data.length - 1);
    const yScale = v => pad.top + ch - (v - minV) / (maxV - minV) * ch;
    const xScale = i => pad.left + i * xStep;

    let pathD = '';
    let dots = '';
    let labels = '';

    data.forEach((d, i) => {
      const x = xScale(i);
      const y = yScale(d.draw_num);
      pathD += (i === 0 ? 'M' : 'L') + x + ',' + y + ' ';
      const color = d.draw_num >= 14 ? '#c4444a' : '#2f855a';
      dots += `<circle cx="${x}" cy="${y}" r="3" fill="${color}" stroke="#f4f5f7" stroke-width="1"/>`;
      if (i < data.length) {
        dots += `<text x="${x}" y="${y - 8}" text-anchor="middle" fill="${color}" font-family="JetBrains Mono,monospace" font-size="11" font-weight="700">${d.draw_num}</text>`;
      }
    });

    // Y轴标签
    for (let v = 0; v <= 27; v += 3) {
      const y = yScale(v);
      labels += `<line x1="${pad.left}" y1="${y}" x2="${W - pad.right}" y2="${y}" stroke="rgba(29,29,31,0.06)" stroke-width="1"/>`;
      labels += `<text x="${pad.left - 8}" y="${y + 4}" text-anchor="end" fill="#8b8b91" font-family="JetBrains Mono,monospace" font-size="12">${v}</text>`;
    }

    // 14分界线
    const midY = yScale(14);
    labels += `<line x1="${pad.left}" y1="${midY}" x2="${W - pad.right}" y2="${midY}" stroke="#b7791f" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.7"/>`;
    labels += `<text x="${W - pad.right + 5}" y="${midY + 4}" fill="#b7791f" font-family="JetBrains Mono,monospace" font-size="12" font-weight="700">14</text>`;

    // X轴期号标签 (首尾)
    labels += `<text x="${pad.left}" y="${H - 10}" text-anchor="start" fill="#8b8b91" font-family="JetBrains Mono,monospace" font-size="12">${data[0].draw_nbr}</text>`;
    labels += `<text x="${W - pad.right}" y="${H - 10}" text-anchor="end" fill="#8b8b91" font-family="JetBrains Mono,monospace" font-size="12">${data[data.length - 1].draw_nbr}</text>`;

    svg.innerHTML = `
      <defs>
        <linearGradient id="trendGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#2c5282" stop-opacity="0.12"/>
          <stop offset="100%" stop-color="#2c5282" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${labels}
      <path d="${pathD} L${xScale(data.length - 1)},${pad.top + ch} L${xScale(0)},${pad.top + ch} Z" fill="url(#trendGrad)"/>
      <path d="${pathD}" fill="none" stroke="#2c5282" stroke-width="2" stroke-linejoin="round"/>
      ${dots}
    `;
    svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  } catch (e) {
    svg.innerHTML = '<text x="50%" y="50%" text-anchor="middle" fill="#c4444a" font-family="JetBrains Mono,monospace" font-size="14">加载失败</text>';
  }
}

// ========== 未开期数 ==========
async function loadUnopened() {
  try {
    const resp = await fetch('/api/unopened');
    const data = await resp.json();

    // Strip
    const types = ['小单', '小双', '大单', '大双'];
    document.getElementById('unopenedStrip').innerHTML = types.map(t => {
      const count = data[t] || 0;
      return `<div class="unopened-item">
        <span class="unopened-type">${t}</span>
        <span class="unopened-count ${count >= 10 ? 'hot' : ''}">${count}</span>
        <span class="unopened-type">期未开</span>
      </div>`;
    }).join('');

    // Grid
    const allTypes = [
      { key: '大', desc: '和值 ≥ 14' },
      { key: '小', desc: '和值 < 14' },
      { key: '单', desc: '和值为奇数' },
      { key: '双', desc: '和值为偶数' },
      { key: '大单', desc: '大 + 单' },
      { key: '大双', desc: '大 + 双' },
      { key: '小单', desc: '小 + 单' },
      { key: '小双', desc: '小 + 双' },
    ];
    document.getElementById('unopenedGrid').innerHTML = allTypes.map(t => {
      const count = data[t.key] || 0;
      return `<div class="unopened-card">
        <div class="type-label">${t.key}</div>
        <div class="type-count ${count >= 10 ? 'hot' : ''}">${count}</div>
        <div class="type-desc">${t.desc}</div>
      </div>`;
    }).join('');
  } catch (e) {
    console.error('加载未开期数失败:', e);
  }
}

// ========== 特码未出 ==========
async function loadSumUnopened() {
  try {
    const resp = await fetch('/api/sum-unopened');
    const data = await resp.json();
    const grid = document.getElementById('sumUnopenedGrid');
    if (!data.groups) {
      grid.innerHTML = '<div class="loading">无数据</div>';
      return;
    }
    grid.innerHTML = data.groups.map(g => {
      const oddsStr = Number.isInteger(g.odds) ? g.odds + '倍' : g.odds + '倍';
      return g.sums.map((s, i) => {
        const cnt = g.unopened[i];
        const cntStr = cnt < 0 ? '—' : cnt;
        // 热度判定: 按赔率档位估算理论周期, 遗漏超过 2 倍理论周期为 hot, 1.5 倍为 warm
        // 理论周期 ≈ 1 / 概率, 概率 = 该和值组合数 / 1000
        // 简化: 用赔率近似 (高赔率 = 低概率 = 长周期)
        const theoreticalPeriod = Math.max(20, g.odds * 1.2);
        let hotClass = '';
        if (cnt > theoreticalPeriod * 2) hotClass = 'hot';
        else if (cnt > theoreticalPeriod * 1.5) hotClass = 'warm';
        return `<div class="sum-card">
          <div class="sc-head">
            <span class="sc-num">${String(s).padStart(2,'0')}</span>
            <span class="sc-odd">${oddsStr}</span>
          </div>
          <div class="sc-count ${hotClass}">${cntStr}</div>
          <div class="sc-label">期未出</div>
        </div>`;
      }).join('');
    }).join('');
  } catch (e) {
    console.error('加载特码未出失败:', e);
    document.getElementById('sumUnopenedGrid').innerHTML = '<div class="loading">加载失败</div>';
  }
}

// ========== Tab 切换 ==========
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');

    if (btn.dataset.tab === 'trend') {
      const activeBtn = document.querySelector('.trend-btn.active');
      loadTrend(activeBtn ? activeBtn.dataset.limit : 30);
    } else if (btn.dataset.tab === 'sum-unopened') {
      loadSumUnopened();
    }
  });
});

// 走势图周期切换
document.querySelectorAll('.trend-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.trend-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    loadTrend(btn.dataset.limit);
  });
});

// ========== 初始化 ==========
async function init() {
  await syncServerTime();
  updateCountdown();
  countdownInterval = setInterval(updateCountdown, 200);
  syncInterval = setInterval(syncServerTime, 30000);  // 每30秒同步时钟

  // 启动 SSE 实时推送 (采集到新数据时, 服务器主动通知前端)
  setupSSE();

  await loadLatest(false);
  await loadHistory(1);
  await loadUnopened();
}

init();
</script>
